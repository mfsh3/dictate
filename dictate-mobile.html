<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dictate">
<meta name="theme-color" content="#0e0e0f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Dictate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0e0f; --surface-low: #131314; --surface: #1a191b;
  --surface-high: #201f21; --surface-bright: #2c2c2d; --surface-top: #262627;
  --text: #ffffff; --muted: #adaaab; --dim: #767576;
  --primary: #b6a0ff; --primary-dim: #7e51ff;
  --danger: #ff6e84; --ok: #22c55e;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  touch-action: manipulation;
  overflow: hidden;
  position: relative;
  -webkit-user-select: none;
  user-select: none;
}

/* Ambient glow */
body::before {
  content: "";
  position: fixed;
  top: -30%;
  left: 50%;
  transform: translateX(-50%);
  width: 200%;
  height: 70%;
  background: radial-gradient(ellipse, rgba(126,81,255,.06) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* ── App container ── */
.app {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  height: 100%;
  padding: .6rem .8rem .5rem;
  gap: .5rem;
}

/* ── Costs row ── */
.costs {
  display: flex;
  gap: .7rem;
  font-size: .6rem;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: .1em;
  font-weight: 600;
  padding: .1rem .1rem 0;
  flex-shrink: 0;
}
.costs b {
  font-family: 'Manrope', 'Segoe UI', sans-serif;
  font-weight: 800;
  color: var(--muted);
  font-size: .68rem;
  letter-spacing: 0;
}
.costs .hi { color: var(--primary); }

/* ── Textarea ── */
.out {
  display: block;
  width: 100%;
  flex: 1;
  min-height: 0;
  resize: none;
  border: none;
  border-radius: .75rem;
  padding: .7rem .8rem;
  font-size: .92rem;
  line-height: 1.55;
  font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
  color: var(--text);
  background: #000;
  box-shadow: inset 0 2px 8px rgba(0,0,0,.6);
  transition: box-shadow .3s ease, opacity .2s;
  outline: none;
  -webkit-user-select: text;
  user-select: text;
}
.out:focus {
  box-shadow: inset 0 2px 8px rgba(0,0,0,.6), 0 0 0 1.5px rgba(182,160,255,.25);
}
.out.fl {
  box-shadow: inset 0 2px 8px rgba(0,0,0,.6), 0 0 0 2.5px rgba(34,197,94,.5), 0 0 20px rgba(34,197,94,.12);
}
.out::placeholder {
  color: #333;
  font-style: italic;
}

/* ── Settings panel ── */
.sp-panel {
  display: none;
  width: 100%;
  flex: 1;
  min-height: 0;
  border-radius: .75rem;
  padding: 1rem 1rem .8rem;
  background: rgba(19,19,20,.92);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  overflow-y: auto;
}
.sp-panel.open { display: flex; flex-direction: column; }
.sp-panel label {
  display: block;
  font-size: .6rem;
  color: var(--dim);
  margin-bottom: .3rem;
  margin-top: .6rem;
  text-transform: uppercase;
  letter-spacing: .1em;
  font-weight: 600;
  font-family: 'Manrope', 'Segoe UI', sans-serif;
}
.sp-panel label:first-child { margin-top: 0; }
.sp-panel input, .sp-panel select {
  width: 100%;
  padding: .55rem .7rem;
  border-radius: .5rem;
  border: none;
  background: var(--surface-top);
  color: var(--text);
  font-size: .9rem;
  outline: none;
  transition: box-shadow .2s;
  font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
}
.sp-panel input:focus, .sp-panel select:focus {
  box-shadow: 0 0 0 1.5px rgba(182,160,255,.35);
}
.sp-panel input::placeholder { color: #484849; }
.sp-panel select { cursor: pointer; }
.sv-btn {
  margin-top: auto;
  padding: .55rem 1.6rem;
  border-radius: 9999px;
  border: none;
  background: linear-gradient(135deg, var(--primary-dim), #a98fff);
  color: #fff;
  font-size: .85rem;
  font-weight: 700;
  font-family: 'Manrope', 'Segoe UI', sans-serif;
  cursor: pointer;
  align-self: flex-end;
  box-shadow: 0 0 16px rgba(126,81,255,.25);
  transition: box-shadow .2s, transform .1s;
}
.sv-btn:hover { box-shadow: 0 0 24px rgba(126,81,255,.45); }
.sv-btn:active { transform: scale(.95); }

/* ── Actions row ── */
.actions {
  display: flex;
  align-items: center;
  gap: .5rem;
  flex-shrink: 0;
  padding: 0 .1rem;
}
.copy-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .4rem;
  padding: .6rem 1rem;
  border-radius: 9999px;
  border: none;
  background: rgba(126,81,255,.18);
  color: var(--primary);
  font-size: .85rem;
  font-weight: 600;
  font-family: 'Manrope', 'Segoe UI', sans-serif;
  cursor: pointer;
  letter-spacing: .02em;
  transition: background .2s, color .2s, box-shadow .2s, transform .1s, opacity .2s;
}
.copy-btn:hover {
  background: rgba(126,81,255,.28);
  box-shadow: 0 0 12px rgba(126,81,255,.15);
}
.copy-btn:active { transform: scale(.95); }
.copy-btn:disabled {
  background: var(--surface-high);
  color: var(--dim);
  cursor: default;
  box-shadow: none;
  opacity: .5;
}
.copy-btn:disabled:active { transform: none; }
.clear-btn {
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: .6rem;
  border: none;
  background: var(--surface);
  color: var(--dim);
  font-size: 1rem;
  cursor: pointer;
  flex-shrink: 0;
  transition: background .2s, color .2s, transform .1s;
}
.clear-btn:hover { background: var(--surface-high); color: var(--muted); }
.clear-btn:active { transform: scale(.95); }

/* ── Status row ── */
.status-row {
  display: flex;
  align-items: center;
  gap: .45rem;
  flex-shrink: 0;
  padding: 0 .15rem;
  min-height: 1.3rem;
}
.dot {
  width: 6px;
  height: 6px;
  border-radius: 9999px;
  flex-shrink: 0;
  transition: background .2s;
}
.dot.rec { background: var(--danger); animation: dot-blink 1s ease-in-out infinite; }
.dot.ok { background: var(--ok); }
.dot.idle { background: transparent; }
@keyframes dot-blink { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
.st-text {
  font-size: .75rem;
  color: var(--muted);
  letter-spacing: .02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}
.wave {
  display: none;
  align-items: flex-end;
  gap: 2px;
  height: 16px;
  margin-left: .15rem;
  flex-shrink: 0;
}
.wave.on { display: flex; }
.wave i {
  display: block;
  width: 3px;
  border-radius: 1.5px;
  background: var(--primary);
  animation: wv .8s ease-in-out infinite;
}
.wave i:nth-child(1) { height: 5px; animation-delay: 0s; }
.wave i:nth-child(2) { height: 12px; animation-delay: .15s; }
.wave i:nth-child(3) { height: 7px; animation-delay: .3s; }
.wave i:nth-child(4) { height: 14px; animation-delay: .1s; }
.wave i:nth-child(5) { height: 6px; animation-delay: .25s; }
@keyframes wv { 0%,100% { transform: scaleY(.4); } 50% { transform: scaleY(1); } }

/* ── Record button ── */
.rb-area {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-shrink: 0;
  padding: .4rem 0 .2rem;
}
.rb-wrap {
  position: relative;
  width: 60px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.rb-ring {
  position: absolute;
  inset: -5px;
  border-radius: 9999px;
  border: 2px solid rgba(182,160,255,.12);
  transition: border-color .3s;
}
.rb-ring.on {
  border-color: rgba(255,110,132,.35);
  animation: ring-pulse 1.8s ease-out infinite;
}
@keyframes ring-pulse {
  0% { transform: scale(1); opacity: 1; }
  100% { transform: scale(1.55); opacity: 0; }
}
.rb {
  width: 60px;
  height: 60px;
  border-radius: 9999px;
  border: none;
  position: relative;
  background: linear-gradient(135deg, #7e51ff, #a98fff);
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 30px rgba(126,81,255,.35), inset 0 1px 0 rgba(255,255,255,.12);
  transition: transform .12s, box-shadow .25s, background .3s;
}
.rb:hover {
  box-shadow: 0 0 45px rgba(126,81,255,.55), inset 0 1px 0 rgba(255,255,255,.12);
}
.rb:active { transform: scale(.92); }
.rb.on {
  background: linear-gradient(135deg, #ef4444, #ff6e84);
  box-shadow: 0 0 40px rgba(255,110,132,.45), inset 0 1px 0 rgba(255,255,255,.12);
}
.rb.busy {
  background: var(--surface-high);
  color: var(--dim);
  pointer-events: none;
  box-shadow: none;
}
.rb svg { filter: drop-shadow(0 1px 3px rgba(0,0,0,.35)); }

/* ── Gear row ── */
.gear-row {
  display: flex;
  align-items: center;
  flex-shrink: 0;
  padding: 0 .15rem .1rem;
}
.gear {
  font-size: 1.1rem;
  cursor: pointer;
  color: #484849;
  padding: .2rem .35rem;
  border-radius: .35rem;
  transition: color .2s, transform .2s;
  line-height: 1;
}
.gear:hover { color: var(--primary); transform: rotate(30deg); }
.gear:active { transform: scale(.9); }
.gear-spacer { flex: 1; }
.reset-btn {
  padding: .25rem .6rem;
  border-radius: .4rem;
  border: none;
  background: transparent;
  font-size: .65rem;
  cursor: pointer;
  color: var(--danger);
  font-weight: 600;
  letter-spacing: .02em;
  transition: background .15s, box-shadow .2s, transform .1s;
}
.reset-btn:hover {
  background: rgba(255,110,132,.08);
  box-shadow: 0 0 8px rgba(255,110,132,.1);
}
.reset-btn:active { transform: scale(.95); }
</style>
</head>
<body>

<div class="app" id="app">
  <!-- Costs row -->
  <div class="costs" id="costs">
    <span>Sess <b id="cS">$0.000</b></span>
    <span>Today <b id="cT" class="hi">$0.000</b></span>
    <span>Total <b id="cA">$0.000</b></span>
  </div>

  <!-- Textarea -->
  <textarea class="out" id="out" readonly placeholder="Transkription erscheint hier..."></textarea>

  <!-- Settings panel (hidden by default) -->
  <div class="sp-panel" id="sp">
    <label for="sKey">API Key</label>
    <input type="password" id="sKey" placeholder="sk-..." autocomplete="off">
    <label for="sLang">Sprache</label>
    <select id="sLang">
      <option value="de">Deutsch</option>
      <option value="en">English</option>
      <option value="fr">Fran&ccedil;ais</option>
      <option value="es">Espa&ntilde;ol</option>
      <option value="it">Italiano</option>
      <option value="nl">Nederlands</option>
      <option value="pt">Portugu&ecirc;s</option>
      <option value="ja">&#26085;&#26412;&#35486;</option>
      <option value="zh">&#20013;&#25991;</option>
    </select>
    <button class="sv-btn" id="svBtn">Speichern</button>
  </div>

  <!-- Actions row -->
  <div class="actions" id="actions">
    <button class="copy-btn" id="cpBtn" disabled>&#x1F4CB; Kopieren</button>
    <button class="clear-btn" id="clBtn" title="Leeren">&#x1F5D1;</button>
  </div>

  <!-- Status row -->
  <div class="status-row">
    <div class="dot idle" id="dot"></div>
    <span class="st-text" id="status">Bereit</span>
    <div class="wave" id="wave">
      <i></i><i></i><i></i><i></i><i></i>
    </div>
  </div>

  <!-- Record button -->
  <div class="rb-area">
    <div class="rb-wrap">
      <div class="rb-ring" id="ring"></div>
      <button class="rb" id="recBtn"></button>
    </div>
  </div>

  <!-- Gear row -->
  <div class="gear-row">
    <span class="gear" id="gear" title="Einstellungen">&#x2699;</span>
    <span class="gear-spacer"></span>
    <button class="reset-btn" id="rsBtn">&#x21BA; costs</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
//  STATE & HELPERS
// ═══════════════════════════════════════════
var WHISPER = 'https://api.openai.com/v1/audio/transcriptions', CPM = 0.006;
var micStream = null, mediaRec = null, chunks = [];
var recording = false, busy = false, recStart = 0, sessCost = 0, lastTxt = '';

function st(k, v) { try { localStorage.setItem(k, v) } catch(e) {} }
function ld(k, d) { try { return localStorage.getItem(k) || d } catch(e) { return d } }
function ldC() { try { return JSON.parse(localStorage.getItem('dc_c')) || {} } catch(e) { return {} } }
function svC(c) { st('dc_c', JSON.stringify(c)) }
function tKey() { return new Date().toISOString().slice(0, 10) }

// ═══════════════════════════════════════════
//  SVG ICON FACTORIES
// ═══════════════════════════════════════════
function svgIcon(path, size) {
  var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 24 24');
  s.setAttribute('width', String(size));
  s.setAttribute('height', String(size));
  s.setAttribute('fill', 'currentColor');
  var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', path);
  s.appendChild(p);
  return s;
}
var ICO_MIC = 'M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z';
var ICO_STOP = 'M6 6h12v12H6z';
var ICO_WAIT = 'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm-.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z';

// ═══════════════════════════════════════════
//  DOM REFERENCES
// ═══════════════════════════════════════════
var $out = document.getElementById('out');
var $sp = document.getElementById('sp');
var $sKey = document.getElementById('sKey');
var $sLang = document.getElementById('sLang');
var $svBtn = document.getElementById('svBtn');
var $cpBtn = document.getElementById('cpBtn');
var $clBtn = document.getElementById('clBtn');
var $rsBtn = document.getElementById('rsBtn');
var $recBtn = document.getElementById('recBtn');
var $ring = document.getElementById('ring');
var $dot = document.getElementById('dot');
var $status = document.getElementById('status');
var $wave = document.getElementById('wave');
var $gear = document.getElementById('gear');
var $cS = document.getElementById('cS');
var $cT = document.getElementById('cT');
var $cA = document.getElementById('cA');

// ═══════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════
// Insert mic icon into record button
$recBtn.appendChild(svgIcon(ICO_MIC, 26));

// Load settings
$sKey.value = ld('dc_k', '');
$sLang.value = ld('dc_l', 'de');

// First run: show settings if no API key
var settingsOpen = false;
if (!ld('dc_k', '').trim()) {
  applySettingsView(true);
} else {
  applySettingsView(false);
}

renderCosts();

// ═══════════════════════════════════════════
//  SETTINGS VIEW
// ═══════════════════════════════════════════
function applySettingsView(open) {
  settingsOpen = open;
  if (open) {
    $sp.classList.add('open');
    $out.style.display = 'none';
    $gear.textContent = '\u2715';
    $gear.title = 'Schlie\u00DFen';
    $sKey.value = ld('dc_k', '');
    $sLang.value = ld('dc_l', 'de');
  } else {
    $sp.classList.remove('open');
    $out.style.display = '';
    $gear.textContent = '\u2699';
    $gear.title = 'Einstellungen';
  }
}

$gear.addEventListener('click', function() {
  applySettingsView(!settingsOpen);
});

$svBtn.addEventListener('click', function() {
  var key = $sKey.value.trim();
  if (!key) {
    pSt('API Key darf nicht leer sein!', 'idle');
    $sKey.focus();
    return;
  }
  st('dc_k', key);
  st('dc_l', $sLang.value);
  applySettingsView(false);
  pSt('\u2713 Gespeichert!', 'ok');
  setTimeout(function() {
    if (!recording && !busy) pSt('Bereit', 'idle');
  }, 1500);
});

// ═══════════════════════════════════════════
//  RECORDING
// ═══════════════════════════════════════════
function toggle() {
  if (busy) return;
  recording ? stopR() : startR();
}

function startR() {
  var k = ld('dc_k', '').trim();
  if (!k) {
    pSt('API Key fehlt!', 'idle');
    applySettingsView(true);
    return;
  }

  function go(stream) {
    micStream = stream;
    var mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' :
      MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '';
    mediaRec = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
    chunks = [];
    mediaRec.ondataavailable = function(e) { if (e.data.size) chunks.push(e.data) };
    mediaRec.onstop = transcribe;
    mediaRec.start(1000);
    recStart = Date.now();
    recording = true;
    updBtn();
    tick();
  }

  if (micStream && micStream.getTracks().some(function(t) { return t.readyState === 'live' })) {
    go(micStream);
  } else {
    navigator.mediaDevices.getUserMedia({ audio: true }).then(go).catch(function() {
      pSt('Mikrofon-Zugriff verweigert', 'idle');
    });
  }
}

function stopR() {
  if (mediaRec && mediaRec.state !== 'inactive') mediaRec.stop();
  recording = false;
  busy = true;
  updBtn();
}

function tick() {
  if (!recording) return;
  var s = Math.floor((Date.now() - recStart) / 1000);
  pSt('REC ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'), 'rec');
  setTimeout(tick, 500);
}

// ═══════════════════════════════════════════
//  TRANSCRIPTION
// ═══════════════════════════════════════════
function transcribe() {
  pSt('Transkribiert\u2026', 'idle');
  var dur = (Date.now() - recStart) / 60000;
  var k = ld('dc_k', '').trim(), lang = ld('dc_l', 'de');
  var ext = (chunks[0] && chunks[0].type && chunks[0].type.indexOf('mp4') >= 0) ? 'mp4' : 'webm';
  var blob = new Blob(chunks, { type: (chunks[0] && chunks[0].type) || 'audio/webm' });
  var fd = new FormData();
  fd.append('file', blob, 'audio.' + ext);
  fd.append('model', 'whisper-1');
  fd.append('language', lang);

  fetch(WHISPER, { method: 'POST', headers: { 'Authorization': 'Bearer ' + k }, body: fd })
  .then(function(r) {
    if (!r.ok) return r.json().catch(function() { return {} }).then(function(e) {
      throw new Error((e.error && e.error.message) || ('HTTP ' + r.status));
    });
    return r.json();
  })
  .then(function(d) {
    lastTxt = d.text || '';
    $out.value = lastTxt;

    // Update costs
    var cost = dur * CPM;
    sessCost += cost;
    var cs = ldC(), tk = tKey();
    cs[tk] = (cs[tk] || 0) + cost;
    cs._t = (cs._t || 0) + cost;
    svC(cs);
    renderCosts();

    if (lastTxt.trim()) {
      $cpBtn.disabled = false;
      pSt('Fertig \u2014 Kopieren tippen', 'ok');
      flash();
    } else {
      pSt('(leere Antwort)', 'idle');
    }
  })
  .catch(function(e) {
    pSt('Fehler: ' + (e.message || e).toString().slice(0, 40), 'idle');
  })
  .then(function() {
    busy = false;
    updBtn();
  });
}

// ═══════════════════════════════════════════
//  UI HELPERS
// ═══════════════════════════════════════════
function pSt(msg, mode) {
  $status.textContent = msg;
  $dot.className = 'dot ' + (mode || 'idle');
}

function updBtn() {
  // Clear existing icon
  while ($recBtn.firstChild) $recBtn.removeChild($recBtn.firstChild);

  if (recording) {
    $recBtn.appendChild(svgIcon(ICO_STOP, 22));
  } else if (busy) {
    $recBtn.appendChild(svgIcon(ICO_WAIT, 22));
  } else {
    $recBtn.appendChild(svgIcon(ICO_MIC, 26));
  }

  $recBtn.className = 'rb' + (recording ? ' on' : busy ? ' busy' : '');
  $ring.className = 'rb-ring' + (recording ? ' on' : '');
  $wave.className = 'wave' + (recording ? ' on' : '');

  if (!recording && !busy) {
    pSt('Bereit', 'idle');
  }
}

function renderCosts() {
  var c = ldC(), f = function(v) { return '$' + v.toFixed(3) };
  $cS.textContent = f(sessCost);
  $cT.textContent = f(c[tKey()] || 0);
  $cA.textContent = f(c._t || 0);
}

function flash() {
  $out.classList.add('fl');
  setTimeout(function() { $out.classList.remove('fl') }, 2000);
}

// ═══════════════════════════════════════════
//  BUTTON LISTENERS
// ═══════════════════════════════════════════
$recBtn.addEventListener('click', toggle);

// IMPORTANT: Copy in direct user gesture handler (iOS Safari requirement)
$cpBtn.addEventListener('click', function() {
  if (!lastTxt) return;
  navigator.clipboard.writeText(lastTxt).then(function() {
    pSt('\u2713 Im Clipboard!', 'ok');
    flash();
  }).catch(function() {
    // Fallback: execCommand
    var ta = document.createElement('textarea');
    ta.value = lastTxt;
    ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy') } catch(e) {}
    document.body.removeChild(ta);
    pSt(ok ? '\u2713 Im Clipboard!' : 'Kopieren fehlgeschlagen', ok ? 'ok' : 'idle');
    if (ok) flash();
  });
});

$clBtn.addEventListener('click', function() {
  lastTxt = '';
  $out.value = '';
  $cpBtn.disabled = true;
  pSt('Bereit', 'idle');
});

$rsBtn.addEventListener('click', function() {
  sessCost = 0;
  try { localStorage.removeItem('dc_c') } catch(e) {}
  renderCosts();
  pSt('Kosten zur\u00FCckgesetzt', 'ok');
  setTimeout(function() {
    if (!recording && !busy) pSt('Bereit', 'idle');
  }, 1500);
});

// ═══════════════════════════════════════════
//  MEDIARECORDER CHECK
// ═══════════════════════════════════════════
if (typeof MediaRecorder === 'undefined') {
  pSt('MediaRecorder nicht verf\u00FCgbar \u2014 iOS 14.3+ n\u00F6tig', 'idle');
  $recBtn.disabled = true;
  $recBtn.className = 'rb busy';
}

// ═══════════════════════════════════════════
//  SERVICE WORKER
// ═══════════════════════════════════════════
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function() {});
}
</script>
