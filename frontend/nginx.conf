server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

  location = /api/transcribe {
    client_max_body_size 4m;
    client_body_buffer_size 4m;
    client_body_in_file_only off;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Client-IP $http_x_real_ip;
    proxy_pass http://backend:3000;
  }

  location /api/ {
    client_max_body_size 128k;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Client-IP $http_x_real_ip;
    proxy_pass http://backend:3000;
  }

  location = /health { proxy_pass http://backend:3000/health; }
  location / { try_files $uri $uri/ /index.html; }
}
