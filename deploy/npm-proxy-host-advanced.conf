# In Nginx Proxy Manager under the dictate.radsup.de proxy host > Advanced.
# Keep the proxy target on the frontend container; never expose the backend.
location = /api/transcribe {
    client_max_body_size 4m;
    client_body_buffer_size 4m;
    client_body_in_file_only off;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_pass http://dictate_frontend:8080;
}
