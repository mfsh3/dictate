<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dictate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0e0f; --surface-low: #131314; --surface: #1a191b;
  --surface-high: #201f21; --surface-bright: #2c2c2d; --surface-top: #262627;
  --text: #ffffff; --muted: #adaaab; --dim: #767576;
  --primary: #b6a0ff; --primary-dim: #7e51ff; --secondary-ctr: #5b2d94;
  --danger: #ff6e84; --ok: #22c55e; --outline: #484849;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
}
.setup { max-width: 380px; margin: 3rem auto; text-align: center; padding: 0 1.2rem; }
.setup h1 {
  font-family: 'Manrope', 'Segoe UI', sans-serif;
  font-size: 1.4rem; font-weight: 800; letter-spacing: .08em;
  text-transform: uppercase; color: var(--primary); margin-bottom: 1.4rem;
}
.setup label {
  display: block; text-align: left; font-size: .65rem; font-weight: 600;
  color: var(--muted); margin-bottom: .3rem; text-transform: uppercase; letter-spacing: .12em;
}
.setup input, .setup select {
  width: 100%; padding: .6rem .75rem; border-radius: .5rem;
  border: none; background: var(--surface-top); color: var(--text);
  font-size: .9rem; margin-bottom: .9rem; outline: none; transition: box-shadow .2s;
}
.setup input:focus, .setup select:focus { box-shadow: 0 0 0 1.5px rgba(182,160,255,.4); }
.setup input::placeholder { color: var(--dim); }
.setup select { cursor: pointer; }
.btn-start {
  display: inline-flex; align-items: center; gap: .5rem;
  padding: .75rem 2rem; border-radius: 9999px; border: none;
  background: linear-gradient(135deg, var(--primary-dim), var(--primary));
  color: #fff; font-family: 'Manrope', sans-serif;
  font-size: .95rem; font-weight: 700; cursor: pointer;
  margin-top: .5rem; letter-spacing: .04em;
  box-shadow: 0 0 30px rgba(126,81,255,.25); transition: transform .15s, box-shadow .2s;
}
.btn-start:hover { box-shadow: 0 0 40px rgba(126,81,255,.4); }
.btn-start:active { transform: scale(.96); }
.btn-start:disabled { background: var(--surface-high); color: var(--dim); cursor: default; box-shadow: none; }
.hint { font-size: .7rem; color: var(--dim); margin-top: .7rem; min-height: 1.2em; }
.hint.err { color: var(--danger); }
.hint.ok { color: var(--ok); }
</style>
</head>
<body>
<div class="setup" id="setup">
  <h1>🎙 Dictate</h1>
  <label for="apiKey">API Key</label>
  <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off">
  <label for="lang">Sprache</label>
  <select id="lang">
    <option value="de">Deutsch</option><option value="en">English</option>
    <option value="fr">Français</option><option value="es">Español</option>
    <option value="it">Italiano</option><option value="nl">Nederlands</option>
    <option value="pt">Português</option><option value="ja">日本語</option>
    <option value="zh">中文</option>
  </select>
  <button class="btn-start" id="btnStart">Dictate starten</button>
  <div class="hint" id="hint">Always-on-top Popup (Chrome / Edge 116+)</div>
</div>
<script>
var WHISPER='https://api.openai.com/v1/audio/transcriptions',CPM=0.006;
var LANGS=[['de','Deutsch'],['en','English'],['fr','Français'],['es','Español'],
  ['it','Italiano'],['nl','Nederlands'],['pt','Português'],['ja','日本語'],['zh','中文']];
var pipWin=null,micStream=null,mediaRec=null,chunks=[];
var recording=false,busy=false,recStart=0,sessCost=0;
var current='',hist=[],histIdx=-1;
var pip={};

function st(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function ld(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}}
function ldC(){try{return JSON.parse(localStorage.getItem('dc_c'))||{}}catch(e){return{}}}
function svC(c){st('dc_c',JSON.stringify(c))}
function ldH(){try{return JSON.parse(localStorage.getItem('dc_h'))||[]}catch(e){return[]}}
function svH(){try{localStorage.setItem('dc_h',JSON.stringify(hist))}catch(e){}}
function tKey(){return new Date().toISOString().slice(0,10)}

var $key=document.getElementById('apiKey'),$lang=document.getElementById('lang'),
    $hint=document.getElementById('hint'),$btn=document.getElementById('btnStart');
$key.value=ld('dc_k','');$lang.value=ld('dc_l','de');
$key.addEventListener('input',function(){st('dc_k',$key.value.trim())});
$lang.addEventListener('change',function(){st('dc_l',$lang.value)});
if(!('documentPictureInPicture' in window)){
  $btn.textContent='Dictate starten (inline)';
  $hint.textContent='PiP nicht verfügbar — Widget öffnet sich hier';
}
$btn.addEventListener('click',launch);
function setHint(m,c){$hint.textContent=m;$hint.className='hint'+(c?' '+c:'')}

function launch(){
  var k=ld('dc_k','').trim();
  if(!k){setHint('API Key eingeben!','err');$key.focus();return}
  setHint('Mikrofon wird angefragt…','');
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    micStream=stream;
    if('documentPictureInPicture' in window){
      documentPictureInPicture.requestWindow({width:420,height:270}).then(function(w){
        pipWin=w;buildWidget(w.document,true);
        w.addEventListener('pagehide',function(){pipWin=null;pip={}});
        setHint('Widget geöffnet — Tab offen lassen','ok');
      }).catch(function(){buildWidget(document,false);setHint('','')});
    } else {buildWidget(document,false);setHint('','');}
  }).catch(function(){setHint('Mikrofon-Zugriff verweigert','err')});
}

// ═══════════════════════════════════════════
//  SVG ICON FACTORIES
// ═══════════════════════════════════════════
function svgIcon(doc,path,size){
  var s=doc.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('viewBox','0 0 24 24');s.setAttribute('width',String(size));
  s.setAttribute('height',String(size));s.setAttribute('fill','currentColor');
  var p=doc.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',path);s.appendChild(p);return s;
}
var ICO_MIC='M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z';
var ICO_STOP='M6 6h12v12H6z';
var ICO_WAIT='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm-.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z';
var ICO_X='M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z';

// ═══════════════════════════════════════════
//  WIDGET CSS
// ═══════════════════════════════════════════
var WCSS=
'*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}'+

// Body + ambient glow
'body{font-family:Inter,Segoe UI,system-ui,sans-serif;background:#0e0e0f;color:#fff;padding:.5rem .7rem;overflow:hidden;position:relative}'+
'body::before{content:"";position:fixed;top:-30%;left:50%;transform:translateX(-50%);width:200%;height:70%;'+
  'background:radial-gradient(ellipse,rgba(126,81,255,.06) 0%,transparent 70%);pointer-events:none;z-index:0}'+
'.root{position:relative;z-index:1}'+

// Costs
'.costs{display:flex;gap:.6rem;font-size:.55rem;color:#767576;margin-bottom:.3rem;padding:0 .15rem;'+
  'text-transform:uppercase;letter-spacing:.1em;font-weight:600}'+
'.costs b{font-family:Manrope,Segoe UI,sans-serif;font-weight:800;color:#adaaab;font-size:.65rem;letter-spacing:0}'+
'.costs .hi{color:#b6a0ff}'+

// Control row
'.ctrl{display:flex;align-items:center;gap:.6rem;margin-bottom:.45rem;padding:0 .1rem}'+

// Record button + outer ring
'.rb-wrap{position:relative;width:44px;height:44px;min-width:44px;display:flex;align-items:center;justify-content:center}'+
'.rb-ring{position:absolute;inset:-4px;border-radius:9999px;border:2px solid rgba(182,160,255,.12);transition:border-color .3s}'+
'.rb-ring.on{border-color:rgba(255,110,132,.3);animation:ring-pulse 1.8s ease-out infinite}'+
'@keyframes ring-pulse{0%{transform:scale(1);opacity:1}100%{transform:scale(1.45);opacity:0}}'+
'.rb{width:44px;height:44px;border-radius:9999px;border:none;position:relative;'+
  'background:linear-gradient(135deg,#7e51ff,#a98fff);color:#fff;cursor:pointer;'+
  'display:flex;align-items:center;justify-content:center;'+
  'box-shadow:0 0 25px rgba(126,81,255,.3),inset 0 1px 0 rgba(255,255,255,.1);'+
  'transition:transform .12s,box-shadow .25s}'+
'.rb:hover{box-shadow:0 0 40px rgba(126,81,255,.5),inset 0 1px 0 rgba(255,255,255,.1)}'+
'.rb:active{transform:scale(.92)}'+
'.rb.on{background:linear-gradient(135deg,#ef4444,#ff6e84);'+
  'box-shadow:0 0 35px rgba(255,110,132,.4),inset 0 1px 0 rgba(255,255,255,.1)}'+
'.rb.busy{background:#201f21;color:#767576;pointer-events:none;box-shadow:none}'+
'.rb svg{filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}'+

// Cancel button (appears next to record button during recording)
'.cx{display:none;width:24px;height:24px;min-width:24px;margin-left:.15rem;'+
  'border:none;border-radius:9999px;background:rgba(255,110,132,.15);color:#ff6e84;'+
  'cursor:pointer;align-items:center;justify-content:center;padding:0;'+
  'transition:background .15s,transform .1s,box-shadow .2s}'+
'.cx.on{display:flex}'+
'.cx:hover{background:rgba(255,110,132,.28);box-shadow:0 0 10px rgba(255,110,132,.2)}'+
'.cx:active{transform:scale(.9)}'+
'.cx svg{filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}'+

// Status area
'.st-area{flex:1;display:flex;align-items:center;gap:.4rem;min-width:0}'+
'.dot{width:6px;height:6px;border-radius:9999px;flex-shrink:0;transition:background .2s}'+
'.dot.rec{background:#ff6e84;animation:dot-blink 1s ease-in-out infinite}'+
'.dot.ok{background:#22c55e}.dot.idle{background:transparent}'+
'@keyframes dot-blink{0%,100%{opacity:1}50%{opacity:.3}}'+
'.st{font-size:.72rem;color:#adaaab;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}'+

// Waveform animation
'.wave{display:none;align-items:end;gap:2px;height:14px;margin-left:.2rem}'+
'.wave.on{display:flex}'+
'.wave i{display:block;width:2.5px;border-radius:1px;background:#b6a0ff;animation:wv .8s ease-in-out infinite}'+
'.wave i:nth-child(1){height:4px;animation-delay:0s}'+
'.wave i:nth-child(2){height:10px;animation-delay:.15s}'+
'.wave i:nth-child(3){height:6px;animation-delay:.3s}'+
'.wave i:nth-child(4){height:12px;animation-delay:.1s}'+
'.wave i:nth-child(5){height:5px;animation-delay:.25s}'+
'@keyframes wv{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}'+

// Gear
'.gear{font-size:.85rem;cursor:pointer;color:#484849;padding:.15rem .25rem;border-radius:.25rem;transition:color .2s,transform .2s}'+
'.gear:hover{color:#b6a0ff;transform:rotate(30deg)}'+

// Textarea
'.out{display:block;width:100%;height:calc(6*1.5em + .9rem);resize:none;'+
  'border:none;border-radius:.65rem;padding:.55rem .65rem;font-size:.85rem;line-height:1.5;'+
  'font-family:Inter,Segoe UI,sans-serif;color:#fff;background:#000;'+
  'box-shadow:inset 0 2px 6px rgba(0,0,0,.5);transition:box-shadow .3s,opacity .2s}'+
'.out:focus{outline:none;box-shadow:inset 0 2px 6px rgba(0,0,0,.5),0 0 0 1.5px rgba(182,160,255,.25)}'+
'.out.fl{box-shadow:inset 0 2px 6px rgba(0,0,0,.5),0 0 0 2px rgba(34,197,94,.5),0 0 15px rgba(34,197,94,.1)}'+
'.out::placeholder{color:#333;font-style:italic}'+

// Bottom bar
'.bar{display:flex;gap:.3rem;margin-top:.35rem;align-items:center;padding:0 .1rem}'+
'.bb{padding:.2rem .45rem;border-radius:.375rem;border:none;'+
  'background:#1a191b;font-size:.65rem;cursor:pointer;color:#767576;'+
  'transition:background .15s,color .15s,box-shadow .2s,transform .1s}'+
'.bb:hover{background:#262627;color:#adaaab;box-shadow:0 0 8px rgba(126,81,255,.1)}'+
'.bb:active{transform:scale(.95);background:#201f21}'+
'.sp{flex:1}'+
'.bb.dg{color:#ff6e84;background:transparent;font-size:.6rem}'+
'.bb.dg:hover{background:rgba(255,110,132,.08);box-shadow:0 0 8px rgba(255,110,132,.1)}'+
'.bb.nav{padding:.2rem .35rem;min-width:1.5rem;font-size:.7rem}'+
'.bb.nav:disabled{opacity:.3;cursor:default;background:#1a191b;color:#484849}'+
'.bb.nav:disabled:hover{background:#1a191b;color:#484849;box-shadow:none;transform:none}'+
'.hlbl{font-size:.6rem;color:#767576;font-family:Manrope,Segoe UI,sans-serif;'+
  'font-weight:700;letter-spacing:.04em;padding:0 .2rem;min-width:2.2rem;text-align:center}'+

// Settings panel
'.sp-panel{display:none;width:100%;height:calc(6*1.5em + .9rem);'+
  'border-radius:.65rem;padding:.55rem .65rem;'+
  'background:rgba(19,19,20,.9);backdrop-filter:blur(30px);overflow-y:auto}'+
'.sp-panel.open{display:block}'+
'.sp-panel label{display:block;font-size:.55rem;color:#767576;margin-bottom:.2rem;margin-top:.45rem;'+
  'text-transform:uppercase;letter-spacing:.1em;font-weight:600}'+
'.sp-panel label:first-child{margin-top:0}'+
'.sp-panel input,.sp-panel select{width:100%;padding:.35rem .5rem;border-radius:.375rem;'+
  'border:none;background:#262627;color:#fff;font-size:.8rem;outline:none;transition:box-shadow .2s}'+
'.sp-panel input:focus,.sp-panel select:focus{box-shadow:0 0 0 1.5px rgba(182,160,255,.3)}'+
'.sp-panel input::placeholder{color:#484849}.sp-panel select{cursor:pointer}'+
'.sv{margin-top:.5rem;padding:.3rem .8rem;border-radius:9999px;border:none;'+
  'background:linear-gradient(135deg,#7e51ff,#a98fff);color:#fff;'+
  'font-size:.75rem;font-weight:700;cursor:pointer;float:right;'+
  'box-shadow:0 0 12px rgba(126,81,255,.2);transition:box-shadow .2s,transform .1s}'+
'.sv:hover{box-shadow:0 0 20px rgba(126,81,255,.4)}.sv:active{transform:scale(.95)}';

// ═══════════════════════════════════════════
//  BUILD WIDGET
// ═══════════════════════════════════════════
function buildWidget(doc,isPip){
  if(isPip){
    var fl=doc.createElement('link');fl.rel='stylesheet';
    fl.href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap';
    doc.head.appendChild(fl);
  }
  var style=doc.createElement('style');
  style.textContent=WCSS+(isPip?'':'.root{max-width:420px;margin:1rem auto;padding:0 1rem}');
  if(isPip)doc.head.appendChild(style);else document.head.appendChild(style);

  var root=doc.createElement('div');root.className='root';

  // ── Costs ──
  var costs=doc.createElement('div');costs.className='costs';
  function mkC(lbl,id,hi){
    var s=doc.createElement('span');s.textContent=lbl;
    var b=doc.createElement('b');b.id=id;b.textContent='$0.000';
    if(hi)b.className='hi';s.appendChild(b);return s;
  }
  costs.appendChild(mkC('Sess ','cS'));
  costs.appendChild(mkC('Today ','cT',true));
  costs.appendChild(mkC('Total ','cA'));
  root.appendChild(costs);

  // ── Control row ──
  var ctrl=doc.createElement('div');ctrl.className='ctrl';

  // Record button with outer ring
  var rbWrap=doc.createElement('div');rbWrap.className='rb-wrap';
  var ring=doc.createElement('div');ring.className='rb-ring';ring.id='ring';
  var recBtn=doc.createElement('button');recBtn.className='rb';recBtn.id='recBtn';
  recBtn.appendChild(svgIcon(doc,ICO_MIC,22));
  rbWrap.appendChild(ring);rbWrap.appendChild(recBtn);
  ctrl.appendChild(rbWrap);

  // Cancel button (hidden until recording)
  var cxBtn=doc.createElement('button');cxBtn.className='cx';cxBtn.id='cxBtn';
  cxBtn.title='Aufnahme abbrechen (Esc)';
  cxBtn.appendChild(svgIcon(doc,ICO_X,14));
  ctrl.appendChild(cxBtn);

  // Status area with dot + waveform
  var stArea=doc.createElement('div');stArea.className='st-area';
  var dot=doc.createElement('div');dot.className='dot idle';dot.id='dot';
  var stTxt=doc.createElement('span');stTxt.className='st';stTxt.id='status';stTxt.textContent='Space = Aufnahme';
  var wave=doc.createElement('div');wave.className='wave';wave.id='wave';
  for(var wi=0;wi<5;wi++){wave.appendChild(doc.createElement('i'))}
  stArea.appendChild(dot);stArea.appendChild(stTxt);stArea.appendChild(wave);
  ctrl.appendChild(stArea);

  var gear=doc.createElement('span');gear.className='gear';gear.id='gear';gear.textContent='\u2699';gear.title='Einstellungen';
  ctrl.appendChild(gear);
  root.appendChild(ctrl);

  // ── Textarea ──
  var ta=doc.createElement('textarea');ta.className='out';ta.id='out';
  ta.placeholder='Transkription erscheint hier\u2026';
  root.appendChild(ta);

  // ── Settings panel ──
  var sp=doc.createElement('div');sp.className='sp-panel';sp.id='sp';
  function mkL(t){var l=doc.createElement('label');l.textContent=t;return l}
  sp.appendChild(mkL('API Key'));
  var sK=doc.createElement('input');sK.type='password';sK.id='sKey';sK.placeholder='sk-...';sK.autocomplete='off';
  sp.appendChild(sK);sp.appendChild(mkL('Sprache'));
  var sL=doc.createElement('select');sL.id='sLang';
  LANGS.forEach(function(p){var o=doc.createElement('option');o.value=p[0];o.textContent=p[1];sL.appendChild(o)});
  sp.appendChild(sL);
  var sv=doc.createElement('button');sv.className='sv';sv.id='svBtn';sv.textContent='Speichern';
  sp.appendChild(sv);root.appendChild(sp);

  // ── Bottom bar ──
  var bar=doc.createElement('div');bar.className='bar';
  var cp=doc.createElement('button');cp.className='bb';cp.id='cpBtn';cp.title='Kopieren';cp.textContent='\uD83D\uDCCB';
  var cl=doc.createElement('button');cl.className='bb';cl.id='clBtn';cl.title='Leeren / Neue Session';cl.textContent='\uD83D\uDDD1';
  var pv=doc.createElement('button');pv.className='bb nav';pv.id='pvBtn';pv.title='Vorheriges Diktat';pv.textContent='\u25C0';
  var hL=doc.createElement('span');hL.className='hlbl';hL.id='hLbl';hL.textContent='';
  var nx=doc.createElement('button');nx.className='bb nav';nx.id='nxBtn';nx.title='N\u00E4chstes Diktat';nx.textContent='\u25B6';
  var spacer=doc.createElement('span');spacer.className='sp';
  var rs=doc.createElement('button');rs.className='bb dg';rs.id='rsBtn';rs.textContent='\u21BA costs';
  bar.appendChild(cp);bar.appendChild(cl);
  bar.appendChild(pv);bar.appendChild(hL);bar.appendChild(nx);
  bar.appendChild(spacer);bar.appendChild(rs);
  root.appendChild(bar);

  if(isPip)doc.body.appendChild(root);
  else document.getElementById('setup').after(root);

  // ── Bind ──
  pip={btn:recBtn,hint:doc.getElementById('status'),out:ta,
    cS:doc.getElementById('cS'),cT:doc.getElementById('cT'),cA:doc.getElementById('cA'),
    gear:gear,panel:sp,sKey:sK,sLang:sL,svBtn:sv,cpBtn:cp,clBtn:cl,rsBtn:rs,
    ring:ring,dot:dot,wave:wave,doc:doc,cxBtn:cxBtn,pvBtn:pv,nxBtn:nx,hLbl:hL};

  pip.sKey.value=ld('dc_k','');pip.sLang.value=ld('dc_l','de');

  var sOpen=false;
  pip.btn.addEventListener('click',toggle);
  pip.cxBtn.addEventListener('click',cancelR);
  pip.cpBtn.addEventListener('click',doCopy);
  pip.clBtn.addEventListener('click',doClear);
  pip.rsBtn.addEventListener('click',doReset);
  pip.pvBtn.addEventListener('click',navPrev);
  pip.nxBtn.addEventListener('click',navNext);

  pip.out.addEventListener('input',function(){
    if(histIdx===-1){
      current=pip.out.value;
    } else {
      hist[histIdx]=pip.out.value;
      svH();
    }
  });

  pip.gear.addEventListener('click',function(){
    sOpen=!sOpen;
    pip.panel.classList.toggle('open',sOpen);
    pip.out.style.display=sOpen?'none':'';
    pip.gear.textContent=sOpen?'\u2715':'\u2699';
    pip.gear.title=sOpen?'Schlie\u00DFen':'Einstellungen';
  });
  pip.svBtn.addEventListener('click',function(){
    st('dc_k',pip.sKey.value.trim());st('dc_l',pip.sLang.value);
    $key.value=pip.sKey.value.trim();$lang.value=pip.sLang.value;
    sOpen=false;pip.panel.classList.remove('open');pip.out.style.display='';
    pip.gear.textContent='\u2699';
    pSt('\u2713 Gespeichert!','ok');
    setTimeout(function(){if(!recording&&!busy)pSt('Space = Aufnahme','idle')},1500);
  });

  doc.addEventListener('keydown',function(e){
    var t=(e.target.tagName||'').toUpperCase();
    if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;
    if(e.code==='Escape'&&recording){e.preventDefault();cancelR();return}
    if(e.code==='Space'||e.key===' '){e.preventDefault();toggle()}
  });
  hist=ldH();
  renderView();
  renderNav();
  renderCosts();
}

// ═══════════════════════════════════════════
//  RECORDING + TRANSCRIPTION
// ═══════════════════════════════════════════
function toggle(){if(busy)return;recording?stopR():startR()}

function cancelR(){
  if(!recording||!mediaRec)return;
  mediaRec.onstop=function(){};
  try{mediaRec.stop()}catch(e){}
  chunks=[];
  recording=false;busy=false;
  updBtn();
  pSt('Abgebrochen','idle');
  setTimeout(function(){if(!recording&&!busy)pSt('Space = Aufnahme','idle')},1200);
}

function startR(){
  var k=ld('dc_k','').trim();
  if(!k){pSt('API Key fehlt!','idle');return}
  function go(stream){
    micStream=stream;
    var mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':
      MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':'';
    mediaRec=new MediaRecorder(stream,mime?{mimeType:mime}:{});
    chunks=[];
    mediaRec.ondataavailable=function(e){if(e.data.size)chunks.push(e.data)};
    mediaRec.onstop=transcribe;
    mediaRec.start(1000);recStart=Date.now();recording=true;updBtn();tick();
  }
  if(micStream&&micStream.getTracks().some(function(t){return t.readyState==='live'})){
    go(micStream);
  } else {
    navigator.mediaDevices.getUserMedia({audio:true}).then(go).catch(function(){pSt('Mikrofon-Fehler','idle')});
  }
}

function stopR(){
  if(mediaRec&&mediaRec.state!=='inactive')mediaRec.stop();
  recording=false;busy=true;updBtn();
}

function tick(){
  if(!recording)return;
  var s=Math.floor((Date.now()-recStart)/1000);
  pSt('REC '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0'),'rec');
  setTimeout(tick,500);
}

function transcribe(){
  pSt('Transkribiert\u2026','idle');
  var dur=(Date.now()-recStart)/60000;
  var k=ld('dc_k','').trim(),lang=ld('dc_l','de');
  var ext=(chunks[0]&&chunks[0].type&&chunks[0].type.indexOf('mp4')>=0)?'mp4':'webm';
  var blob=new Blob(chunks,{type:(chunks[0]&&chunks[0].type)||'audio/webm'});
  var fd=new FormData();
  fd.append('file',blob,'audio.'+ext);fd.append('model','whisper-1');fd.append('language',lang);

  fetch(WHISPER,{method:'POST',headers:{'Authorization':'Bearer '+k},body:fd})
  .then(function(r){
    if(!r.ok)return r.json().catch(function(){return{}}).then(function(e){
      throw new Error((e.error&&e.error.message)||('HTTP '+r.status));
    });
    return r.json();
  })
  .then(function(d){
    var t=(d.text||'').trim();
    var cost=dur*CPM;sessCost+=cost;
    var cs=ldC(),tk=tKey();cs[tk]=(cs[tk]||0)+cost;cs._t=(cs._t||0)+cost;svC(cs);
    renderCosts();
    if(t){
      current=current?current+'\n'+t:t;
      histIdx=-1;
      renderView();
      renderNav();
      return clipCopy(current).then(function(ok){
        pSt(ok?'\u2713 Im Clipboard!':'Fertig \u2014 \uD83D\uDCCB klicken',ok?'ok':'idle');
        if(ok)flash();
      });
    } else {pSt('(leere Antwort)','idle')}
  })
  .catch(function(e){pSt('Fehler: '+(e.message||e).toString().slice(0,35),'idle')})
  .then(function(){busy=false;updBtn()});
}

// ═══════════════════════════════════════════
//  UI HELPERS
// ═══════════════════════════════════════════
function pSt(m,mode){
  if(pip.hint)pip.hint.textContent=m;
  if(pip.dot){
    pip.dot.className='dot '+(mode||'idle');
  }
}

function updBtn(){
  if(!pip.btn)return;
  // Clear and set icon
  while(pip.btn.firstChild)pip.btn.removeChild(pip.btn.firstChild);
  var d=pip.doc||document;
  if(recording) pip.btn.appendChild(svgIcon(d,ICO_STOP,18));
  else if(busy) pip.btn.appendChild(svgIcon(d,ICO_WAIT,18));
  else pip.btn.appendChild(svgIcon(d,ICO_MIC,22));

  pip.btn.className='rb'+(recording?' on':busy?' busy':'');

  // Ring animation
  if(pip.ring){
    pip.ring.className='rb-ring'+(recording?' on':'');
  }
  // Waveform
  if(pip.wave){
    pip.wave.className='wave'+(recording?' on':'');
  }
  // Cancel button
  if(pip.cxBtn){
    pip.cxBtn.className='cx'+(recording?' on':'');
  }
  if(!recording&&!busy)pSt('Space = Aufnahme','idle');
}

function renderCosts(){
  var c=ldC(),f=function(v){return '$'+v.toFixed(3)};
  if(pip.cS)pip.cS.textContent=f(sessCost);
  if(pip.cT)pip.cT.textContent=f(c[tKey()]||0);
  if(pip.cA)pip.cA.textContent=f(c._t||0);
}

function flash(){
  if(!pip.out)return;
  pip.out.classList.add('fl');setTimeout(function(){pip.out.classList.remove('fl')},2000);
}

// ── Robust clipboard (main window first for secure context) ──
function clipCopy(text){
  // Strategy: always try main window's clipboard API first (has secure context)
  // Then fallback to execCommand in whichever document works
  return new Promise(function(resolve){
    // 1. Main window clipboard API
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){resolve(true)}).catch(function(){
        resolve(fbCopy(text));
      });
    } else {
      resolve(fbCopy(text));
    }
  });
}

function fbCopy(text){
  // Try main document first, then PiP document
  if(tryExecCopy(document,text))return true;
  if(pipWin&&pipWin.document)return tryExecCopy(pipWin.document,text);
  return false;
}

function tryExecCopy(doc,text){
  var ta=doc.createElement('textarea');
  ta.value=text;ta.style.cssText='position:fixed;left:-9999px;top:-9999px;opacity:0';
  doc.body.appendChild(ta);ta.focus();ta.select();
  var ok=false;try{ok=doc.execCommand('copy')}catch(e){}
  doc.body.removeChild(ta);return ok;
}

function doCopy(){
  var txt=histIdx===-1?current:(hist[histIdx]||'');
  if(!txt)return;
  clipCopy(txt).then(function(ok){
    pSt(ok?'\u2713 Kopiert!':'Kopieren fehlgeschlagen',ok?'ok':'idle');
    if(ok)flash();
  });
}
function doClear(){
  if(current){
    hist.unshift(current);
    if(hist.length>10)hist.length=10;
    svH();
  }
  current='';histIdx=-1;
  renderView();renderNav();
  pSt('Neue Session','idle');
  setTimeout(function(){if(!recording&&!busy)pSt('Space = Aufnahme','idle')},900);
}

function renderView(){
  if(!pip.out)return;
  pip.out.value=histIdx===-1?current:(hist[histIdx]||'');
}

function renderNav(){
  if(!pip.hLbl)return;
  var n=hist.length;
  if(n===0){
    pip.pvBtn.style.display='none';
    pip.nxBtn.style.display='none';
    pip.hLbl.style.display='none';
    return;
  }
  pip.pvBtn.style.display='';
  pip.nxBtn.style.display='';
  pip.hLbl.style.display='';
  if(histIdx===-1){
    pip.hLbl.textContent='Live';
    pip.pvBtn.disabled=false;
    pip.nxBtn.disabled=true;
  } else {
    pip.hLbl.textContent=(histIdx+1)+'/'+n;
    pip.pvBtn.disabled=(histIdx>=n-1);
    pip.nxBtn.disabled=false;
  }
}

function navPrev(){
  if(hist.length===0)return;
  if(histIdx===-1)histIdx=0;
  else if(histIdx<hist.length-1)histIdx++;
  else return;
  renderView();renderNav();
}

function navNext(){
  if(histIdx===-1)return;
  histIdx--;
  renderView();renderNav();
}
function doReset(){
  sessCost=0;try{localStorage.removeItem('dc_c')}catch(e){}renderCosts();
  pSt('Kosten zur\u00FCckgesetzt','ok');
  setTimeout(function(){if(!recording&&!busy)pSt('Space = Aufnahme','idle')},1500);
}
</script>
